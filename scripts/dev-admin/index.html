<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Sandbox Admin Panel</title>
  <style>
    :root {
      --cobalt: #1b1b26;
      --cobalt-2: #24243a;
      --panel: #ffffff;
      --ink: #1b1b26;
      --muted: #6b6b7b;
      --line: #e3e3ec;
      --pink: #e6738a;
      --pink-ink: #b23c56;
      --green: #2f9e6f;
      --amber: #c98a1a;
      --radius: 12px;
      --font: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f4f4f8;
      color: var(--ink);
      font-family: var(--font);
      line-height: 1.5;
    }
    a { color: var(--pink-ink); }

    .appbar {
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .topbar {
      background: var(--cobalt);
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    /* Category tabs — one page per block */
    .tabs {
      display: flex;
      gap: 2px;
      background: var(--cobalt-2);
      padding: 0 16px;
      border-bottom: 1px solid #3a3a52;
      overflow-x: auto;
    }
    .tab {
      appearance: none;
      border: none;
      background: transparent;
      color: #b9b9cc;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 11px 16px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }
    .tab:hover { color: #fff; }
    .tab.active { color: #fff; border-bottom-color: var(--pink); }
    .tab .tab-count {
      font-size: 0.75rem;
      color: #7a7a9a;
      background: rgba(255,255,255,0.06);
      border-radius: 999px;
      padding: 1px 7px;
    }
    .tab.active .tab-count { color: #cdcde0; }
    .tab .tab-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--amber);
      opacity: 0;
      transition: opacity 0.15s;
    }
    .tab.is-dirty .tab-dot { opacity: 1; }
    .topbar h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 600;
    }
    .topbar .sub { color: #b9b9cc; font-size: 0.85rem; margin: 0; }
    .topbar .spacer { flex: 1; }
    .topbar .env {
      font-size: 0.75rem;
      color: #b9b9cc;
      border: 1px solid #3a3a52;
      border-radius: 999px;
      padding: 3px 10px;
    }

    main { max-width: 940px; margin: 0 auto; padding: 24px; }

    .block {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin-bottom: 24px;
      overflow: hidden;
    }
    .block__head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: #fbfbfd;
    }
    .block__head h2 { margin: 0; font-size: 1.05rem; }
    .block__head .count { color: var(--muted); font-size: 0.85rem; }
    .block__head .spacer { flex: 1; }
    .dirty-dot {
      display: none;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--amber);
    }
    .block.is-dirty .dirty-dot { display: inline-block; }

    .entries { padding: 8px 18px 18px; }
    .entry {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px 14px;
    }
    .entry__fields { display: grid; gap: 8px; }
    .entry__fields--component { grid-template-columns: 1fr 1fr; }
    .entry__fields--component .field--wide { grid-column: 1 / -1; }
    .entry__side {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      justify-content: flex-start;
    }
    .entry > .source-panel { grid-column: 1 / -1; }
    .field { display: grid; gap: 3px; }
    .field label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    input[type="text"], textarea, select {
      font: inherit;
      font-size: 0.9rem;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      width: 100%;
      resize: vertical;
    }
    input:focus, textarea:focus, select:focus { outline: 2px solid var(--pink); border-color: var(--pink); }
    textarea { min-height: 58px; }
    .field .mono { font-family: var(--mono); font-size: 0.82rem; }

    .btn {
      font: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      cursor: pointer;
    }
    .btn:hover { border-color: var(--muted); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn--primary { background: var(--pink); border-color: var(--pink); color: #fff; }
    .btn--primary:hover { background: var(--pink-ink); border-color: var(--pink-ink); }
    .btn--push { background: #fff; color: var(--cobalt); border: none; font-weight: 600; }
    .btn--ghost { border: none; background: transparent; color: var(--muted); padding: 4px 8px; }
    .btn--ghost:hover { color: var(--pink-ink); }
    .btn--danger:hover { color: #c0392b; }
    .btn--sm { font-size: 0.78rem; padding: 5px 10px; }
    .icon-row { display: flex; gap: 2px; }

    /* Active/Concluded toggle (home experiments) */
    .toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.82rem; user-select: none; }
    .toggle input { position: absolute; opacity: 0; pointer-events: none; }
    .toggle .track {
      width: 40px; height: 22px; border-radius: 999px;
      background: #cdcdd8; position: relative; transition: background 0.15s;
    }
    .toggle .track::after {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 18px; height: 18px; border-radius: 50%; background: #fff;
      transition: transform 0.15s;
    }
    .toggle input:checked + .track { background: var(--green); }
    .toggle input:checked + .track::after { transform: translateX(18px); }
    .toggle .state-label { min-width: 66px; color: var(--muted); }

    /* Status badge (components) */
    .status-badge {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .status-badge[data-status="stable"]     { background: #e5f4ec; color: #1e6f4e; }
    .status-badge[data-status="wip"]        { background: #fbf0da; color: #8a5b12; }
    .status-badge[data-status="vendored"]   { background: #e8ecfb; color: #35468a; }
    .status-badge[data-status="deprecated"] { background: #fbe5e8; color: #8a2733; }

    /* Source editor (components) */
    .source-panel { margin-top: 4px; border-top: 1px dashed var(--line); padding-top: 10px; }
    .source-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .source-path { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); word-break: break-all; }
    .source-body { margin-top: 10px; display: none; }
    .source-body.open { display: block; }
    textarea.code {
      font-family: var(--mono);
      font-size: 0.8rem;
      line-height: 1.45;
      min-height: 320px;
      white-space: pre;
      overflow: auto;
      tab-size: 2;
    }
    textarea.code[readonly] { background: #f7f7fb; color: #40404f; }
    .source-actions { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    .source-actions .spacer { flex: 1; }
    .source-note { font-size: 0.78rem; color: var(--muted); }
    .source-note.readonly { color: #8a5b12; }

    /* Live preview pane (components) */
    a.btn { text-decoration: none; display: inline-flex; align-items: center; }
    .preview-body { margin-top: 10px; display: none; }
    .preview-body.open { display: block; }
    .preview-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .preview-toolbar .spacer { flex: 1; }
    .preview-iframe {
      display: block;
      width: 100%;
      height: 440px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .block__foot {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      border-top: 1px solid var(--line);
      background: #fbfbfd;
    }
    .block__foot .spacer { flex: 1; }
    .save-note { font-size: 0.8rem; color: var(--muted); }

    /* Toast / push feedback */
    #toast {
      position: fixed;
      right: 20px; bottom: 20px;
      max-width: 380px;
      background: var(--cobalt);
      color: #fff;
      padding: 14px 16px;
      border-radius: 10px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
      font-size: 0.88rem;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 40;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.ok { background: #1e6f4e; }
    #toast.err { background: #8a2733; }

    .empty { color: var(--muted); font-size: 0.88rem; padding: 12px 0; }
  </style>
</head>
<body>
  <header class="appbar">
    <div class="topbar">
      <div>
        <h1>Sandbox Admin Panel</h1>
        <p class="sub">Pick a category, edit, then Push to deploy.</p>
      </div>
      <div class="spacer"></div>
      <span class="env" id="branch">branch …</span>
      <button class="btn btn--push" id="publish">Push</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>

  <main id="app">
    <p class="empty">Loading…</p>
  </main>

  <div id="toast"></div>

  <script type="module">
    const STATUSES = ['stable', 'wip', 'vendored', 'deprecated']

    // Each block: which array it edits and how it renders. `kind`
    // 'listing' → home listings (path/title/description [+active]);
    // 'component' → the preview library (name/label/status/source/desc).
    const BLOCKS = [
      { key: 'sections',    title: 'Browse',      kind: 'listing',   hasActive: false, noun: 'entry' },
      { key: 'pages',       title: 'Pages',       kind: 'listing',   hasActive: false, noun: 'page' },
      { key: 'experiments', title: 'Experiments', kind: 'listing',   hasActive: true,  noun: 'experiment' },
      { key: 'components',  title: 'Components',  kind: 'component',                    noun: 'component' },
    ]

    // state[key] = current (possibly edited) array; saved[key] = last-saved baseline
    let state = {}
    let saved = {}

    const app = document.getElementById('app')
    const toastEl = document.getElementById('toast')
    let toastTimer

    function toast(msg, kind) {
      clearTimeout(toastTimer)
      toastEl.textContent = msg
      toastEl.className = 'show' + (kind ? ' ' + kind : '')
      toastTimer = setTimeout(() => { toastEl.className = '' }, 5000)
    }

    // __origName is a client-only field tracking each component's slug as
    // it exists on disk, so we can (a) compute renames on save and (b) key
    // source reads/writes to the file that actually exists. Stripped
    // before anything is sent back to the server.
    function stripInternal(arr) {
      return arr.map((o) => {
        const c = {}
        for (const k of Object.keys(o)) if (!k.startsWith('__')) c[k] = o[k]
        return c
      })
    }

    function isDirty(key) {
      return JSON.stringify(stripInternal(state[key] || [])) !==
             JSON.stringify(stripInternal(saved[key] || []))
    }

    function clone(v) { return JSON.parse(JSON.stringify(v)) }

    async function load() {
      const res = await fetch('/__admin/api/data')
      if (!res.ok) { app.innerHTML = '<p class="empty">Failed to load data.</p>'; return }
      const data = await res.json()
      // Stamp __origName on components so renames are detectable.
      ;(data.components || []).forEach((e) => { e.__origName = e.name })
      state = clone(data)
      saved = clone(data)
      render()
    }

    function makeEntry(def) {
      if (def.kind === 'component') {
        return { name: '', label: '', status: 'stable', source: '', description: '' }
      }
      const e = { path: '/', title: '', description: '' }
      if (def.hasActive) e.active = true
      return e
    }

    // Which category page is showing, from the URL hash (#/components).
    // Falls back to the first block for an empty/unknown hash.
    function currentKey() {
      const k = location.hash.replace(/^#\/?/, '').trim()
      return BLOCKS.some((b) => b.key === k) ? k : BLOCKS[0].key
    }

    function renderTabs() {
      const nav = document.getElementById('tabs')
      const active = currentKey()
      nav.innerHTML = ''
      for (const def of BLOCKS) {
        const items = state[def.key] || []
        const tab = document.createElement('button')
        tab.className =
          'tab' +
          (def.key === active ? ' active' : '') +
          (isDirty(def.key) ? ' is-dirty' : '')
        tab.innerHTML =
          `${def.title}` +
          `<span class="tab-count">${items.length}</span>` +
          `<span class="tab-dot" title="Unsaved changes"></span>`
        tab.onclick = () => { location.hash = '#/' + def.key }
        nav.appendChild(tab)
      }
    }

    // One category page at a time. State for every block stays in memory,
    // so switching tabs never drops an in-progress (unsaved) edit.
    function render() {
      renderTabs()
      const def = BLOCKS.find((b) => b.key === currentKey())
      app.innerHTML = ''
      app.appendChild(renderBlock(def))
    }

    window.addEventListener('hashchange', render)

    function renderBlock(def) {
      const items = state[def.key] || []
      const wrap = document.createElement('section')
      wrap.className = 'block' + (isDirty(def.key) ? ' is-dirty' : '')

      const head = document.createElement('div')
      head.className = 'block__head'
      head.innerHTML =
        `<h2>${def.title}</h2>` +
        `<span class="count">${items.length} ${def.noun}${items.length === 1 ? '' : 's'}</span>` +
        `<span class="dirty-dot" title="Unsaved changes"></span>` +
        `<span class="spacer"></span>`
      const addBtn = document.createElement('button')
      addBtn.className = 'btn'
      addBtn.textContent = '+ Add ' + def.noun
      addBtn.onclick = () => {
        state[def.key] = [...items, makeEntry(def)]
        render()
      }
      head.appendChild(addBtn)
      wrap.appendChild(head)

      const list = document.createElement('div')
      list.className = 'entries'
      if (items.length === 0) {
        const p = document.createElement('p')
        p.className = 'empty'
        p.textContent = 'No ' + def.noun + 's yet.'
        list.appendChild(p)
      }
      const renderer = def.kind === 'component' ? renderComponentEntry : renderListingEntry
      items.forEach((item, i) => list.appendChild(renderer(def, item, i)))
      wrap.appendChild(list)

      const foot = document.createElement('div')
      foot.className = 'block__foot'
      const note = document.createElement('span')
      note.className = 'save-note'
      note.textContent = isDirty(def.key) ? 'Unsaved changes' : 'Saved'
      const saveBtn = document.createElement('button')
      saveBtn.className = 'btn btn--primary'
      saveBtn.textContent = 'Save ' + def.title
      saveBtn.disabled = !isDirty(def.key)
      saveBtn.onclick = () => saveByKey(def.key)
      foot.appendChild(note)
      foot.appendChild(document.createElement('span')).className = 'spacer'
      foot.appendChild(saveBtn)
      wrap.appendChild(foot)

      return wrap
    }

    // ── Home listing entry ───────────────────────────────────────────
    function renderListingEntry(def, item, index) {
      const items = state[def.key]
      const el = document.createElement('div')
      el.className = 'entry'

      const fields = document.createElement('div')
      fields.className = 'entry__fields'
      fields.appendChild(textField('Path', item.path, (v) => { item.path = v; markDirty(def.key) }))
      fields.appendChild(textField('Title', item.title, (v) => { item.title = v; markDirty(def.key) }))
      fields.appendChild(textArea('Description', item.description, (v) => { item.description = v; markDirty(def.key) }))
      el.appendChild(fields)

      const side = document.createElement('div')
      side.className = 'entry__side'
      if (def.hasActive) {
        side.appendChild(activeToggle(item, () => { markDirty(def.key); render() }))
      }
      side.appendChild(rowControls(def, items, index))
      el.appendChild(side)
      return el
    }

    // ── Component entry ──────────────────────────────────────────────
    function renderComponentEntry(def, item, index) {
      const items = state[def.key]
      const el = document.createElement('div')
      el.className = 'entry'

      const fields = document.createElement('div')
      fields.className = 'entry__fields entry__fields--component'
      fields.appendChild(textField('Name', item.label, (v) => { item.label = v; markDirty(def.key) }))
      fields.appendChild(slugField('Slug (route id)', item.name, (v) => { item.name = v; markDirty(def.key) }))
      fields.appendChild(statusField(item, () => markDirty(def.key)))
      fields.appendChild(sourcePathField(item))
      const desc = textArea('Description', item.description, (v) => { item.description = v; markDirty(def.key) })
      desc.classList.add('field--wide')
      fields.appendChild(desc)
      el.appendChild(fields)

      const side = document.createElement('div')
      side.className = 'entry__side'
      side.appendChild(rowControls(def, items, index))
      el.appendChild(side)

      el.appendChild(sourcePanel(item))
      return el
    }

    function rowControls(def, items, index) {
      const icons = document.createElement('div')
      icons.className = 'icon-row'
      icons.appendChild(iconBtn('↑', 'Move up', index === 0, () => move(def.key, index, -1)))
      icons.appendChild(iconBtn('↓', 'Move down', index === items.length - 1, () => move(def.key, index, 1)))
      const rm = iconBtn('✕', 'Remove', false, () => {
        state[def.key] = items.filter((_, j) => j !== index)
        render()
      })
      rm.classList.add('btn--danger')
      icons.appendChild(rm)
      return icons
    }

    function textField(label, value, onInput) {
      const f = document.createElement('div')
      f.className = 'field'
      const l = document.createElement('label')
      l.textContent = label
      const input = document.createElement('input')
      input.type = 'text'
      input.value = value || ''
      input.oninput = () => onInput(input.value)
      f.appendChild(l)
      f.appendChild(input)
      return f
    }

    function slugField(label, value, onInput) {
      const f = textField(label, value, (v) => onInput(v.trim().toLowerCase()))
      f.querySelector('input').classList.add('mono')
      return f
    }

    function textArea(label, value, onInput) {
      const f = document.createElement('div')
      f.className = 'field'
      const l = document.createElement('label')
      l.textContent = label
      const ta = document.createElement('textarea')
      ta.value = value || ''
      ta.oninput = () => onInput(ta.value)
      f.appendChild(l)
      f.appendChild(ta)
      return f
    }

    function statusField(item, onChange) {
      const f = document.createElement('div')
      f.className = 'field'
      const l = document.createElement('label')
      l.textContent = 'Status'
      const sel = document.createElement('select')
      for (const s of STATUSES) {
        const opt = document.createElement('option')
        opt.value = s
        opt.textContent = s
        if ((item.status || 'stable') === s) opt.selected = true
        sel.appendChild(opt)
      }
      sel.onchange = () => { item.status = sel.value; onChange() }
      f.appendChild(l)
      f.appendChild(sel)
      return f
    }

    function sourcePathField(item) {
      const f = document.createElement('div')
      f.className = 'field'
      const l = document.createElement('label')
      l.textContent = 'Source path'
      const input = document.createElement('input')
      input.type = 'text'
      input.className = 'mono'
      input.value = item.source || ''
      input.readOnly = true
      input.title = 'Where this preview renders from. Edit the file below (vendored sources only).'
      f.appendChild(l)
      f.appendChild(input)
      return f
    }

    // Collapsible source editor + live preview. Source is editable only
    // for src/… (vendored) sources; sibling external-site sources open
    // read-only. The preview iframe embeds the real /components/<slug>
    // route (bare) and updates on save via Vite HMR.
    function sourcePanel(item) {
      const panel = document.createElement('div')
      panel.className = 'source-panel'

      const head = document.createElement('div')
      head.className = 'source-head'
      const srcToggle = document.createElement('button')
      srcToggle.className = 'btn btn--sm'
      srcToggle.textContent = 'View / edit source'
      const styleToggle = document.createElement('button')
      styleToggle.className = 'btn btn--sm'
      styleToggle.textContent = 'View / edit styles'
      const previewToggle = document.createElement('button')
      previewToggle.className = 'btn btn--sm'
      previewToggle.textContent = 'Live preview'
      const path = document.createElement('span')
      path.className = 'source-path'
      path.textContent = item.source || '(no source path)'
      head.appendChild(srcToggle)
      head.appendChild(styleToggle)
      head.appendChild(previewToggle)
      head.appendChild(path)
      panel.appendChild(head)

      const body = document.createElement('div')
      body.className = 'source-body'
      panel.appendChild(body)

      const styleBody = document.createElement('div')
      styleBody.className = 'source-body'
      panel.appendChild(styleBody)

      const preview = document.createElement('div')
      preview.className = 'preview-body'
      panel.appendChild(preview)

      let loadedSource = false
      srcToggle.onclick = async () => {
        const open = body.classList.toggle('open')
        srcToggle.textContent = open ? 'Hide source' : 'View / edit source'
        if (open && !loadedSource) { loadedSource = true; await loadFile(item, body, 'source') }
      }

      let loadedStyles = false
      styleToggle.onclick = async () => {
        const open = styleBody.classList.toggle('open')
        styleToggle.textContent = open ? 'Hide styles' : 'View / edit styles'
        if (open && !loadedStyles) { loadedStyles = true; await loadFile(item, styleBody, 'styles') }
      }

      let mountedPreview = false
      previewToggle.onclick = () => {
        const open = preview.classList.toggle('open')
        previewToggle.textContent = open ? 'Hide preview' : 'Live preview'
        if (open && !mountedPreview) { mountedPreview = true; mountPreview(item, preview) }
      }
      return panel
    }

    // Embed the real preview route (bare) in an iframe. It's the same app
    // the gallery uses, so edits to a vendored source file hot-update here
    // via Vite HMR — live on save. Keyed to the on-disk slug (__origName)
    // so it points at a route that actually exists.
    function mountPreview(item, container) {
      const slug = item.__origName
      if (!slug) {
        container.innerHTML =
          '<p class="source-note">Save this component first, then it can be previewed.</p>'
        return
      }
      const url = '/components/' + encodeURIComponent(slug) + '?bare=1'

      const toolbar = document.createElement('div')
      toolbar.className = 'preview-toolbar'
      const note = document.createElement('span')
      note.className = 'source-note'
      note.textContent = 'Live — hot-updates when you save source or styles.'
      const spacer = document.createElement('span')
      spacer.className = 'spacer'
      const reload = document.createElement('button')
      reload.className = 'btn btn--sm'
      reload.textContent = '↻ Reload'
      reload.onclick = () => reloadPreview(slug)
      const openTab = document.createElement('a')
      openTab.className = 'btn btn--sm'
      openTab.href = url
      openTab.target = '_blank'
      openTab.rel = 'noreferrer'
      openTab.textContent = 'Open ↗'
      toolbar.appendChild(note)
      toolbar.appendChild(spacer)
      toolbar.appendChild(reload)
      toolbar.appendChild(openTab)

      const frame = document.createElement('iframe')
      frame.className = 'preview-iframe'
      frame.src = url
      frame.title = 'Live preview of ' + slug
      frame.setAttribute('data-preview-slug', slug)

      container.appendChild(toolbar)
      container.appendChild(frame)
    }

    function reloadPreview(slug) {
      const frame = document.querySelector('iframe[data-preview-slug="' + slug + '"]')
      if (!frame) return
      try { frame.contentWindow.location.reload() }
      catch { frame.src = frame.src }
    }

    // Load one of a component's files (field: 'source' | 'styles') into a
    // code editor. Editable when it's vendored in this repo; sibling
    // external-site files open read-only. Saving writes the file, which
    // hot-updates any open live-preview via Vite HMR.
    async function loadFile(item, body, field) {
      const origName = item.__origName
      if (!origName) {
        body.innerHTML = '<p class="source-note">Save this component first, then its ' + field + ' becomes editable.</p>'
        return
      }
      body.innerHTML = '<p class="source-note">Loading ' + field + '…</p>'
      let data
      try {
        const res = await fetch('/__admin/api/source?name=' + encodeURIComponent(origName) + '&field=' + field)
        data = await res.json()
        if (!res.ok) throw new Error(data.error || 'failed to read ' + field)
      } catch (err) {
        body.innerHTML = '<p class="source-note readonly">' + err.message + '</p>'
        return
      }

      if (!data.source) {
        body.innerHTML = '<p class="source-note">No ' + field + ' file is set for this component.</p>'
        return
      }

      body.innerHTML = ''
      const pathLine = document.createElement('div')
      pathLine.className = 'source-path'
      pathLine.style.marginBottom = '6px'
      pathLine.textContent = data.source
      body.appendChild(pathLine)

      const ta = document.createElement('textarea')
      ta.className = 'code'
      ta.value = data.exists ? data.content : ''
      ta.readOnly = !data.editable
      if (!data.exists) ta.placeholder = field + ' file not found: ' + (data.source || '')
      body.appendChild(ta)

      const actions = document.createElement('div')
      actions.className = 'source-actions'
      const note = document.createElement('span')
      note.className = 'source-note' + (data.editable ? '' : ' readonly')
      note.textContent = data.editable
        ? 'Vendored in this repo — edits are saved to the file directly.'
        : 'Read-only — this file lives in external-site.'
      actions.appendChild(note)
      actions.appendChild(document.createElement('span')).className = 'spacer'

      if (data.editable) {
        const saveBtn = document.createElement('button')
        saveBtn.className = 'btn btn--primary btn--sm'
        saveBtn.textContent = 'Save ' + field
        saveBtn.onclick = async () => {
          saveBtn.disabled = true
          try {
            const res = await fetch('/__admin/api/source', {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name: origName, content: ta.value, field }),
            })
            const b = await res.json()
            if (!res.ok) throw new Error(b.error || 'save failed')
            toast('Saved ' + field + ' for ' + origName + ' (' + b.bytes + ' bytes).', 'ok')
          } catch (err) {
            toast(field + ' save failed: ' + err.message, 'err')
          } finally {
            saveBtn.disabled = false
          }
        }
        actions.appendChild(saveBtn)
      }
      body.appendChild(actions)
    }

    function activeToggle(item, onChange) {
      const wrap = document.createElement('label')
      wrap.className = 'toggle'
      const cb = document.createElement('input')
      cb.type = 'checkbox'
      cb.checked = !!item.active
      const track = document.createElement('span')
      track.className = 'track'
      const lbl = document.createElement('span')
      lbl.className = 'state-label'
      lbl.textContent = item.active ? 'Active' : 'Concluded'
      cb.onchange = () => { item.active = cb.checked; onChange() }
      wrap.appendChild(cb)
      wrap.appendChild(track)
      wrap.appendChild(lbl)
      return wrap
    }

    function iconBtn(glyph, title, disabled, onClick) {
      const b = document.createElement('button')
      b.className = 'btn btn--ghost'
      b.textContent = glyph
      b.title = title
      b.disabled = disabled
      b.onclick = onClick
      return b
    }

    function move(key, index, delta) {
      const arr = state[key]
      const j = index + delta
      if (j < 0 || j >= arr.length) return
      const copy = [...arr]
      ;[copy[index], copy[j]] = [copy[j], copy[index]]
      state[key] = copy
      render()
    }

    // Reflect dirty state without a full re-render (keeps input focus).
    // Only the active block is on screen; also refresh the tab dots.
    function markDirty(key) {
      const block = key === currentKey() ? app.querySelector('.block') : null
      if (block) {
        const dirty = isDirty(key)
        block.classList.toggle('is-dirty', dirty)
        const saveBtn = block.querySelector('.btn--primary')
        if (saveBtn) saveBtn.disabled = !dirty
        const note = block.querySelector('.save-note')
        if (note) note.textContent = dirty ? 'Unsaved changes' : 'Saved'
      }
      renderTabs()
    }

    function saveByKey(key) {
      return key === 'components' ? saveComponents() : saveListing(key)
    }

    async function saveListing(key) {
      try {
        const res = await fetch('/__admin/api/block/' + key, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(state[key]),
        })
        const body = await res.json()
        if (!res.ok) throw new Error(body.error || 'save failed')
        saved[key] = clone(state[key])
        render()
        toast('Saved ' + key + ' (' + body.count + ' items).', 'ok')
      } catch (err) {
        toast('Save failed: ' + err.message, 'err')
      }
    }

    async function saveComponents() {
      const items = state.components || []
      const renames = []
      for (const it of items) {
        if (it.__origName && it.__origName !== it.name) {
          renames.push({ from: it.__origName, to: it.name })
        }
      }
      try {
        const res = await fetch('/__admin/api/components', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ entries: stripInternal(items), renames }),
        })
        const body = await res.json()
        if (!res.ok) throw new Error(body.error || 'save failed')
        // Renames applied — re-baseline __origName to the new slugs.
        items.forEach((it) => { it.__origName = it.name })
        saved.components = clone(items)
        render()
        const extra = body.renamed ? ' (' + body.renamed + ' renamed)' : ''
        toast('Saved components (' + body.count + ' items)' + extra + '.', 'ok')
      } catch (err) {
        toast('Save failed: ' + err.message, 'err')
      }
    }

    async function publish() {
      const dirtyKeys = BLOCKS.map((s) => s.key).filter(isDirty)
      if (dirtyKeys.length) {
        const ok = confirm(
          'You have unsaved changes in: ' + dirtyKeys.join(', ') +
          '.\nOnly saved changes are pushed. Save them first?\n\n' +
          'OK = save all, then push. Cancel = push only saved changes.'
        )
        if (ok) {
          for (const k of dirtyKeys) await saveByKey(k)
        }
      }
      try {
        const res = await fetch('/__admin/api/publish', { method: 'POST' })
        const body = await res.json()
        if (!res.ok) throw new Error(body.error || 'push failed')
        if (body.published === false) { toast(body.reason, 'ok'); return }
        toast(body.message, body.deploy ? 'ok' : '')
      } catch (err) {
        toast('Push failed: ' + err.message, 'err')
      }
    }

    document.getElementById('publish').onclick = publish

    // Show the current branch so it's obvious where Push will land.
    fetch('/__admin/api/info')
      .then((r) => r.json())
      .then((info) => {
        const el = document.getElementById('branch')
        if (!info.branch) { el.textContent = 'not a git repo'; return }
        el.textContent = 'branch: ' + info.branch + (info.isMain ? ' → deploys' : '')
      })
      .catch(() => {})
    load()
  </script>
</body>
</html>
