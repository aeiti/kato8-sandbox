<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kato.8 Sandbox</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@300;400;500;600;700&family=RocknRoll+One&display=swap"
      rel="stylesheet"
    />
    <script>
      // SPA fallback decoder for GitHub Pages.
      // Pairs with public/404.html — converts /?/kickstarter-buttons back into /kickstarter-buttons
      // before React Router reads window.location, so direct visits and refreshes work.
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          )
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
