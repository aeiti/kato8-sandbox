<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350" role="img" aria-label="Pokémon card template placeholder">
  <!-- PLACEHOLDER card template. Replace this file with the real Pokémon
       card art (same path, or update TEMPLATE_SRC in PokemonTemplateCard).
       Slot rectangles below match the overlay coordinates in
       studio-bios.css (.sb-tpl__* under .sb-tpl--poke). -->
  <rect x="4" y="4" width="242" height="342" rx="16" fill="#f4edd6" stroke="#e8b23a" stroke-width="8"/>
  <rect x="9" y="9" width="232" height="332" rx="12" fill="none" stroke="#caa53f" stroke-width="1"/>
  <!-- name bar -->
  <rect x="16" y="14" width="218" height="26" rx="6" fill="#efe3bf" stroke="#caa53f" stroke-width="1"/>
  <!-- art window (8%,13% → 84%×40%) -->
  <rect x="20" y="45.5" width="210" height="140" rx="3" fill="#ffffff" stroke="#caa53f" stroke-width="3"/>
  <!-- type / role divider -->
  <rect x="20" y="190" width="210" height="16" rx="3" fill="#efe3bf"/>
  <!-- text / effect box (62% → 28%) -->
  <rect x="20" y="217" width="210" height="98" rx="3" fill="#fbf7ec" stroke="#d9c78f" stroke-width="1"/>
  <line x1="20" y1="322" x2="230" y2="322" stroke="#caa53f" stroke-width="1"/>
  <text x="125" y="337" text-anchor="middle" font-family="Gill Sans, Segoe UI, sans-serif" font-size="7" letter-spacing="1.5" fill="#b58f2e" opacity="0.7">POKÉMON TEMPLATE · PLACEHOLDER</text>
</svg>
