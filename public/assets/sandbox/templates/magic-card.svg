<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 350" role="img" aria-label="Magic card template placeholder">
  <!-- PLACEHOLDER card template. Replace with the real Magic card art
       (same path, or update TEMPLATE_SRC in MagicTemplateCard). Slot
       rectangles match .sb-tpl__* under .sb-tpl--mtg in studio-bios.css. -->
  <rect x="3" y="3" width="244" height="344" rx="14" fill="#211d17"/>
  <rect x="12" y="12" width="226" height="326" rx="8" fill="#cdbd9a" stroke="#0d0b08" stroke-width="1.5"/>
  <!-- name bar -->
  <rect x="16" y="14" width="218" height="26" rx="12" fill="#f1e8d3" stroke="#0d0b08" stroke-width="1"/>
  <!-- art window -->
  <rect x="20" y="45.5" width="210" height="140" fill="#e9ddc2" stroke="#0d0b08" stroke-width="2"/>
  <!-- type line -->
  <rect x="16" y="190" width="218" height="18" rx="9" fill="#f1e8d3" stroke="#0d0b08" stroke-width="1"/>
  <!-- rules / flavor text box -->
  <rect x="18" y="214" width="214" height="104" rx="2" fill="#f6efdd" stroke="#0d0b08" stroke-width="1"/>
  <text x="125" y="336" text-anchor="middle" font-family="Georgia, serif" font-size="7" letter-spacing="1.2" fill="#e9ddc2" opacity="0.8">MAGIC TEMPLATE · PLACEHOLDER</text>
